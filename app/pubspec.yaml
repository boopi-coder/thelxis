name: thelxis
description: "Thelxis — modern remote desktop"
publish_to: none

version: 0.3.2+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_webrtc: ^1.6.2+hotfix.4
  web_socket_channel: ^3.0.3
  cryptography: ^2.9.0
  provider: ^6.1.5+1
  uuid: ^4.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  ffi: ^2.2.0
  win32: ^5.15.0
  collection: ^1.19.1
  url_launcher: ^6.3.3
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tray.png
    - assets/icon/tray_template.png
    - assets/icon/tray.ico
    - assets/icon/app_icon.png


