name: E2E

# Real-stack end-to-end tests: two peers in one process over loopback with the real libwebrtc, signed
# handshake, data channels, embedded TURN and screen capture (on a virtual X display). Only hardware / OS
# pieces (input injection, session badge, prompts) are replaced by recording fakes.
#
# Callable (workflow_call) so the release pipeline can require a green run before it publishes.

on:
  push:
    branches: [main, 'e2e/**']
  pull_request:
  workflow_dispatch:
    inputs:
      pulseaudio:
        description: Start a PulseAudio null sink first (turn off to reproduce the crash without it)
        type: boolean
        default: true
      repeat:
        description: Run the whole suite this many times in one job (flakiness soak)
        type: number
        default: 1
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  loopback:
    name: Loopback session over real WebRTC
    # Same image as the Linux release build: the prebuilt libwebrtc.so links against its libraries.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Build dependencies identical to the Linux job in build.yml, plus a virtual X server for the GTK window and
      # for libwebrtc's X11 screen capturer, and Mesa's software GL so Flutter can render without a GPU.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libx11-dev libxi-dev libpulse-dev \
            libxtst-dev libxrandr-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxext-dev libxrender-dev \
            libasound2-dev libdrm-dev libgbm-dev \
            xvfb x11-utils libgl1-mesa-dri libegl1 libgles2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The runner has no sound card. Without a PulseAudio-compatible server libwebrtc aborts inside
      # WebRtcVoiceEngine::Init() while the first PeerConnection is created (reproduce with the
      # `pulseaudio: false` dispatch input), so give it a null sink to talk to.
      - name: Start a PulseAudio server with a null sink
        if: github.event_name != 'workflow_dispatch' || inputs.pulseaudio
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes || true
          sleep 1
          pactl load-module module-null-sink sink_name=e2e_sink || true
          pactl info | head -n 5 || true

      - name: Run end-to-end tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/e2e" "$RUNNER_TEMP/cores"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p" || true
          ulimit -c unlimited
          # One flutter invocation per file: a crashed app must not stop the next file from running.
          status=0
          for round in $(seq 1 "$REPEAT"); do
            for f in integration_test/*_test.dart; do
              echo "::group::$f (round $round)"
              xvfb-run -a -s "-screen 0 1280x800x24" \
                flutter test "$f" -d linux --reporter expanded 2>&1 | tee -a "$RUNNER_TEMP/e2e/test.log" || status=1
              pkill -f 'bundle/thelxis' || true
              echo "::endgroup::"
            done
          done
          exit $status

      # The flutter tool does not forward the app's stdout/stderr, so a native crash is silent: read the
      # progress markers the tests write and the backtrace of any core dump.
      - name: Crash diagnostics
        if: failure()
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends gdb >/dev/null || true
          echo "--- progress markers"; cat /tmp/e2e_progress.log 2>/dev/null || echo none
          echo "--- cores"; ls -la "$RUNNER_TEMP/cores" || true
          for c in "$RUNNER_TEMP"/cores/core.*; do
            [ -f "$c" ] || continue
            gdb -batch -ex "info signal" -ex "bt 30" build/linux/x64/debug/bundle/thelxis "$c" 2>&1 | grep -E "^(Program terminated|#[0-9]+)" | cut -c1-220
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e/
          if-no-files-found: ignore
          retention-days: 7
