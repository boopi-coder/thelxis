name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Secrets let CI builds use the same signing identities as releases (APKs update in place, the macOS app keeps
    # its Screen Recording / Accessibility grants). GitHub does not expose secrets to pull requests from forks;
    # the build then falls back to debug/ad-hoc signing.
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-dev.${{ github.run_number }}
      release: false
    secrets: inherit
