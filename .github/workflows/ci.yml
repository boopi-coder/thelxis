name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # No secrets are passed on purpose: CI builds are debug-signed throwaway artifacts.
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-dev.${{ github.run_number }}
      release: false
