name: Release

# Cut a release:  git tag v0.1.0 && git push origin v0.1.0
# Or run this workflow manually and give it a tag (it is created on the selected commit if missing).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 or v0.2.0-rc.1'
        type: string
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a valid release tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          version="${tag#v}"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, prerelease=$prerelease)"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
    secrets: inherit

  e2e:
    name: End-to-end
    needs: prepare
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      # Trust anchor the app ships with (app/lib/update/update_trust.dart). The signing secret must match it.
      UPDATE_PUBLIC_KEY: CCI7L8D_i2lGhmSZvtjKdTP76EbtWRipgrIw3_Cdgvk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          merge-multiple: true
          path: dist

      # --- signed update manifest (stable releases only: `releases/latest` never points at a pre-release)
      - name: Check the app trusts the manifest key
        if: env.PRERELEASE == 'false'
        run: |
          set -euo pipefail
          if ! grep -Fq "'$UPDATE_PUBLIC_KEY'" app/lib/update/update_trust.dart; then
            echo "::error file=app/lib/update/update_trust.dart::publicKey in the app differs from UPDATE_PUBLIC_KEY in release.yml; installed apps would reject this release's updates"
            exit 1
          fi

      - name: Install signing tools
        if: env.PRERELEASE == 'false'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'cryptography>=42'

      - name: Create and sign update.json
        if: env.PRERELEASE == 'false'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY secret is not set; refusing to publish a stable release without a signed update manifest"
            exit 1
          fi
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" packaging/sign_update.py manifest \
            --version "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dist dist --out dist/update.json
          "$py" packaging/sign_update.py sign \
            --manifest dist/update.json --out dist/update.json.sig \
            --public-key "$UPDATE_PUBLIC_KEY"

      - name: Verify update.json signature
        if: env.PRERELEASE == 'false'
        run: |
          set -euo pipefail
          # Re-check from scratch with only the public key: signature over the exact bytes, plus
          # name/size/sha256 of every asset against the files about to be uploaded.
          "$RUNNER_TEMP/venv/bin/python" packaging/sign_update.py verify \
            --manifest dist/update.json --sig dist/update.json.sig \
            --public-key "$UPDATE_PUBLIC_KEY" --dist dist --version "$VERSION"
          cat dist/update.json

      - name: Checksums and release notes
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # Hash everything that will be uploaded (never the checksum file itself).
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{TAG}}/$TAG/g" packaging/RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"

      # Uploaded as a draft and published only after every asset is in place, so nobody (including the
      # in-app updater polling releases/latest) can see a release whose files are still uploading.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Thelxis ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      # The exact path the app polls. Informational: a private repository or CDN lag must not fail a finished release.
      - name: Smoke-test the published manifest
        if: env.PRERELEASE == 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live"
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/live/update.json" "$base/update.json"
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/live/update.json.sig" "$base/update.json.sig"
          "$RUNNER_TEMP/venv/bin/python" packaging/sign_update.py verify \
            --manifest "$RUNNER_TEMP/live/update.json" --sig "$RUNNER_TEMP/live/update.json.sig" \
            --public-key "$UPDATE_PUBLIC_KEY" --version "$VERSION"
